name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  program:
    name: Solana program
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and Solana platform tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
          key: sbf-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build program (SBF)
        run: cargo build-sbf --manifest-path programs/rise/Cargo.toml --sbf-out-dir target/deploy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Program tests (Bankrun)
        env:
          NODE_OPTIONS: --no-experimental-strip-types
          TS_NODE_TRANSPILE_ONLY: "1"
        run: |
          mkdir -p tests/fixtures
          cp target/deploy/rise.so tests/fixtures/rise.so
          npx ts-mocha -p ./tsconfig.json -t 1000000 tests/rise.ts

      - name: Program size
        run: ls -l target/deploy/rise.so

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rise-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  web:
    name: Website and API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: API routes load
        run: |
          node -e "Promise.all([import('./api/sol.js'), import('./api/seeker.js')]).then(m => { if (m.some(x => typeof x.default !== 'function')) process.exit(1); console.log('api ok'); })"

      - name: Front-end scripts parse
        run: node --check public/rise.js
