name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change what runs.
jobs:
  program:
    name: Solana program
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache Cargo and Solana platform tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
          key: sbf-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build program (SBF)
        run: cargo build-sbf --manifest-path programs/rise/Cargo.toml --sbf-out-dir target/deploy

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Program tests (Bankrun)
        env:
          NODE_OPTIONS: --no-experimental-strip-types
          TS_NODE_TRANSPILE_ONLY: "1"
        run: |
          mkdir -p tests/fixtures
          cp target/deploy/rise.so tests/fixtures/rise.so
          set -o pipefail
          npx ts-mocha -p ./tsconfig.json -t 1000000 tests/rise.ts 2>&1 | grep -v "DEBUG solana_runtime" | tee test-output.txt || {
            grep -E "Error|failing|passing|[0-9]+\) " test-output.txt | head -n 10 | while read -r line; do echo "::error title=Program tests::$line"; done
            exit 1
          }

      - name: Program size
        run: ls -l target/deploy/rise.so

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rise-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  web:
    name: Website and API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: API routes load
        run: |
          node -e "Promise.all([import('./api/sol.js'), import('./api/seeker.js')]).then(m => { if (m.some(x => typeof x.default !== 'function')) process.exit(1); console.log('api ok'); })"

      - name: Front-end scripts parse
        run: node --check public/rise.js
